<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bathypulse Station Watch</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; background: #e8f1f0; color: #172c37; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(560px, calc(100% - 32px)); border-top: 6px solid #147a78; background: #fff; padding: 28px; box-sizing: border-box; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 0; color: #52636a; }
    #state { margin-top: 28px; padding: 14px; background: #e6f5ef; color: #126443; font-weight: 700; }
    #state.down { background: #fde8e7; color: #a12d27; }
    small { display: block; margin-top: 18px; color: #6f7f85; }
  </style>
</head>
<body>
  <main>
    <h1>Bathypulse Station Watch</h1>
    <p>Deep-sea microseismic observatory service</p>
    <div id="state">Checking service health...</div>
    <small id="updated"></small>
  </main>
  <script>
    const state = document.querySelector('#state');
    const updated = document.querySelector('#updated');
    async function refresh() {
      try {
        const response = await fetch('/healthz', { cache: 'no-store' });
        if (!response.ok) throw new Error('unhealthy');
        state.textContent = 'Service healthy';
        state.classList.remove('down');
      } catch (_) {
        state.textContent = 'Service unavailable';
        state.classList.add('down');
      }
      updated.textContent = `Last checked ${new Date().toLocaleTimeString()}`;
    }
    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
